<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <title>GAS Tutorial Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .card-icon {
            width: 30px;
            height: 30px;
            margin-right: 10px;
            font-size: 24px;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .button:hover {
            opacity: 0.9;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-top: 10px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .input-group {
            margin: 15px 0;
        }

        .input-label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .output-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 200px;
            overflow-y: auto;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 GAS Tutorial Dashboard</h1>
            <p class="subtitle">Learn Google Apps Script with interactive examples</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('basics')">Basics</button>
            <button class="tab" onclick="switchTab('data')">Data Operations</button>
            <button class="tab" onclick="switchTab('automation')">Automation</button>
            <button class="tab" onclick="switchTab('advanced')">Advanced</button>
        </div>

        <!-- Basics Tab -->
        <div id="basics" class="tab-content active">
            <div class="grid">
                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">📝</span>
                        Write to Cell
                    </div>
                    <div class="input-group">
                        <label class="input-label">Cell Reference</label>
                        <input type="text" class="input-field" id="cellRef" value="A1" />
                    </div>
                    <div class="input-group">
                        <label class="input-label">Value</label>
                        <input type="text" class="input-field" id="cellValue" value="Hello, GAS!" />
                    </div>
                    <button class="button" onclick="writeToCell()">Write to Cell</button>
                    <div id="writeStatus"></div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">📖</span>
                        Read from Range
                    </div>
                    <div class="input-group">
                        <label class="input-label">Range (e.g., A1:B10)</label>
                        <input type="text" class="input-field" id="readRange" value="A1:B10" />
                    </div>
                    <button class="button" onclick="readFromRange()">Read Data</button>
                    <div class="output-box" id="readOutput"></div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">🎨</span>
                        Format Cells
                    </div>
                    <div class="input-group">
                        <label class="input-label">Range</label>
                        <input type="text" class="input-field" id="formatRange" value="A1:C3" />
                    </div>
                    <div class="input-group">
                        <label class="input-label">Background Color</label>
                        <input type="color" class="input-field" id="bgColor" value="#667eea" />
                    </div>
                    <button class="button" onclick="formatCells()">Apply Format</button>
                    <div id="formatStatus"></div>
                </div>
            </div>
        </div>

        <!-- Data Operations Tab -->
        <div id="data" class="tab-content">
            <div class="grid">
                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">📊</span>
                        Create Chart
                    </div>
                    <div class="input-group">
                        <label class="input-label">Data Range</label>
                        <input type="text" class="input-field" id="chartRange" value="A1:B10" />
                    </div>
                    <div class="input-group">
                        <label class="input-label">Chart Type</label>
                        <select class="input-field" id="chartType">
                            <option value="COLUMN">Column</option>
                            <option value="LINE">Line</option>
                            <option value="PIE">Pie</option>
                            <option value="BAR">Bar</option>
                        </select>
                    </div>
                    <button class="button" onclick="createChart()">Create Chart</button>
                    <div id="chartStatus"></div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">🔍</span>
                        Find & Replace
                    </div>
                    <div class="input-group">
                        <label class="input-label">Find</label>
                        <input type="text" class="input-field" id="findText" />
                    </div>
                    <div class="input-group">
                        <label class="input-label">Replace with</label>
                        <input type="text" class="input-field" id="replaceText" />
                    </div>
                    <button class="button" onclick="findAndReplace()">Execute</button>
                    <div id="replaceStatus"></div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">🗃️</span>
                        Sort Data
                    </div>
                    <div class="input-group">
                        <label class="input-label">Range</label>
                        <input type="text" class="input-field" id="sortRange" value="A1:C10" />
                    </div>
                    <div class="input-group">
                        <label class="input-label">Sort Column</label>
                        <input type="number" class="input-field" id="sortColumn" value="1" min="1" />
                    </div>
                    <button class="button" onclick="sortData()">Sort</button>
                    <div id="sortStatus"></div>
                </div>
            </div>
        </div>

        <!-- Automation Tab -->
        <div id="automation" class="tab-content">
            <div class="grid">
                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">📧</span>
                        Send Email
                    </div>
                    <div class="input-group">
                        <label class="input-label">Recipient</label>
                        <input type="email" class="input-field" id="emailTo" placeholder="email@example.com" />
                    </div>
                    <div class="input-group">
                        <label class="input-label">Subject</label>
                        <input type="text" class="input-field" id="emailSubject" />
                    </div>
                    <button class="button" onclick="sendEmail()">Send Email</button>
                    <div id="emailStatus"></div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">⏰</span>
                        Set Trigger
                    </div>
                    <div class="input-group">
                        <label class="input-label">Function Name</label>
                        <input type="text" class="input-field" id="triggerFunction" value="myFunction" />
                    </div>
                    <div class="input-group">
                        <label class="input-label">Interval (minutes)</label>
                        <input type="number" class="input-field" id="triggerInterval" value="30" min="1" />
                    </div>
                    <button class="button" onclick="setTrigger()">Create Trigger</button>
                    <div id="triggerStatus"></div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">📁</span>
                        Create Folder
                    </div>
                    <div class="input-group">
                        <label class="input-label">Folder Name</label>
                        <input type="text" class="input-field" id="folderName" value="My GAS Folder" />
                    </div>
                    <button class="button" onclick="createFolder()">Create in Drive</button>
                    <div id="folderStatus"></div>
                </div>
            </div>
        </div>

        <!-- Advanced Tab -->
        <div id="advanced" class="tab-content">
            <div class="grid">
                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">🌐</span>
                        API Request
                    </div>
                    <div class="input-group">
                        <label class="input-label">API URL</label>
                        <input type="text" class="input-field" id="apiUrl" value="https://api.github.com/users/google" />
                    </div>
                    <button class="button" onclick="makeApiRequest()">Fetch Data</button>
                    <div class="output-box" id="apiOutput"></div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">💾</span>
                        Batch Operations
                    </div>
                    <div class="input-group">
                        <label class="input-label">Number of Rows</label>
                        <input type="number" class="input-field" id="batchRows" value="100" />
                    </div>
                    <button class="button" onclick="runBatchOperation()">
                        Run Batch
                        <span id="batchSpinner"></span>
                    </button>
                    <div class="progress-bar">
                        <div class="progress-fill" id="batchProgress"></div>
                    </div>
                    <div id="batchStatus"></div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span class="card-icon">📈</span>
                        Performance Test
                    </div>
                    <button class="button" onclick="runPerformanceTest()">Run Test</button>
                    <div class="output-box" id="perfOutput"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => tab.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        // Basic operations
        function writeToCell() {
            const cell = document.getElementById('cellRef').value;
            const value = document.getElementById('cellValue').value;

            showStatus('writeStatus', 'pending', 'Writing...');

            google.script.run
                .withSuccessHandler(() => showStatus('writeStatus', 'success', 'Written successfully!'))
                .withFailureHandler(err => showStatus('writeStatus', 'error', err.message))
                .writeToCell(cell, value);
        }

        function readFromRange() {
            const range = document.getElementById('readRange').value;
            const output = document.getElementById('readOutput');

            output.textContent = 'Loading...';

            google.script.run
                .withSuccessHandler(data => {
                    output.textContent = JSON.stringify(data, null, 2);
                })
                .withFailureHandler(err => {
                    output.textContent = 'Error: ' + err.message;
                })
                .readFromRange(range);
        }

        function formatCells() {
            const range = document.getElementById('formatRange').value;
            const color = document.getElementById('bgColor').value;

            showStatus('formatStatus', 'pending', 'Formatting...');

            google.script.run
                .withSuccessHandler(() => showStatus('formatStatus', 'success', 'Formatted!'))
                .withFailureHandler(err => showStatus('formatStatus', 'error', err.message))
                .formatCells(range, color);
        }

        // Data operations
        function createChart() {
            const range = document.getElementById('chartRange').value;
            const type = document.getElementById('chartType').value;

            showStatus('chartStatus', 'pending', 'Creating chart...');

            google.script.run
                .withSuccessHandler(() => showStatus('chartStatus', 'success', 'Chart created!'))
                .withFailureHandler(err => showStatus('chartStatus', 'error', err.message))
                .createChart(range, type);
        }

        function findAndReplace() {
            const find = document.getElementById('findText').value;
            const replace = document.getElementById('replaceText').value;

            showStatus('replaceStatus', 'pending', 'Processing...');

            google.script.run
                .withSuccessHandler(count => showStatus('replaceStatus', 'success', `Replaced ${count} occurrences`))
                .withFailureHandler(err => showStatus('replaceStatus', 'error', err.message))
                .findAndReplace(find, replace);
        }

        function sortData() {
            const range = document.getElementById('sortRange').value;
            const column = document.getElementById('sortColumn').value;

            showStatus('sortStatus', 'pending', 'Sorting...');

            google.script.run
                .withSuccessHandler(() => showStatus('sortStatus', 'success', 'Sorted!'))
                .withFailureHandler(err => showStatus('sortStatus', 'error', err.message))
                .sortData(range, parseInt(column));
        }

        // Automation
        function sendEmail() {
            const to = document.getElementById('emailTo').value;
            const subject = document.getElementById('emailSubject').value;

            showStatus('emailStatus', 'pending', 'Sending...');

            google.script.run
                .withSuccessHandler(() => showStatus('emailStatus', 'success', 'Email sent!'))
                .withFailureHandler(err => showStatus('emailStatus', 'error', err.message))
                .sendEmail(to, subject);
        }

        function setTrigger() {
            const funcName = document.getElementById('triggerFunction').value;
            const interval = document.getElementById('triggerInterval').value;

            showStatus('triggerStatus', 'pending', 'Creating trigger...');

            google.script.run
                .withSuccessHandler(() => showStatus('triggerStatus', 'success', 'Trigger created!'))
                .withFailureHandler(err => showStatus('triggerStatus', 'error', err.message))
                .setTrigger(funcName, parseInt(interval));
        }

        function createFolder() {
            const name = document.getElementById('folderName').value;

            showStatus('folderStatus', 'pending', 'Creating folder...');

            google.script.run
                .withSuccessHandler(url => showStatus('folderStatus', 'success', `Created! URL: ${url}`))
                .withFailureHandler(err => showStatus('folderStatus', 'error', err.message))
                .createFolder(name);
        }

        // Advanced
        function makeApiRequest() {
            const url = document.getElementById('apiUrl').value;
            const output = document.getElementById('apiOutput');

            output.textContent = 'Fetching...';

            google.script.run
                .withSuccessHandler(data => {
                    output.textContent = JSON.stringify(data, null, 2);
                })
                .withFailureHandler(err => {
                    output.textContent = 'Error: ' + err.message;
                })
                .makeApiRequest(url);
        }

        function runBatchOperation() {
            const rows = document.getElementById('batchRows').value;
            const spinner = document.getElementById('batchSpinner');
            const progress = document.getElementById('batchProgress');

            spinner.className = 'spinner';
            showStatus('batchStatus', 'pending', 'Running batch operation...');

            let progressValue = 0;
            const interval = setInterval(() => {
                progressValue += 10;
                progress.style.width = progressValue + '%';

                if (progressValue >= 100) {
                    clearInterval(interval);
                    spinner.className = '';
                    showStatus('batchStatus', 'success', `Processed ${rows} rows`);
                }
            }, 200);

            google.script.run
                .withSuccessHandler(() => {
                    clearInterval(interval);
                    progress.style.width = '100%';
                    spinner.className = '';
                    showStatus('batchStatus', 'success', `Processed ${rows} rows`);
                })
                .withFailureHandler(err => {
                    clearInterval(interval);
                    spinner.className = '';
                    showStatus('batchStatus', 'error', err.message);
                })
                .runBatchOperation(parseInt(rows));
        }

        function runPerformanceTest() {
            const output = document.getElementById('perfOutput');
            output.textContent = 'Running performance test...';

            google.script.run
                .withSuccessHandler(results => {
                    output.textContent = results;
                })
                .withFailureHandler(err => {
                    output.textContent = 'Error: ' + err.message;
                })
                .runPerformanceTest();
        }

        // Utility function
        function showStatus(elementId, type, message) {
            const element = document.getElementById(elementId);
            element.className = `status ${type}`;
            element.textContent = message;
        }
    </script>
</body>
</html>
